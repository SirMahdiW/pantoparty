  <!-- ضدکش: سرویس‌ورکر/کش قدیمی را پاک و صفحه را تازه می‌کند -->
  <script>
  (function () {
    try {
      var V = '2.5.18', K = 'adabazi_ver';
      var native = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
      if (native || location.protocol === 'file:') return;
      if (localStorage.getItem(K) === V) return;
      localStorage.setItem(K, V);
      var need = false, jobs = [];
      if (window.caches && window.caches.keys) {
        jobs.push(window.caches.keys().then(function (ks) {
          if (!ks.length) return null;
          need = true;
          return Promise.all(ks.map(function (n) { return window.caches.delete(n); }));
        }).catch(function () {}));
      }
      if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
        jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
          if (!rs.length) return null;
          need = true;
          return Promise.all(rs.map(function (r) { return r.unregister(); }));
        }).catch(function () {}));
      }
      Promise.all(jobs).then(function () { if (need) location.reload(); });
    } catch (e) {}
  })();
  </script>
